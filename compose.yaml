services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4

  nginx:
    image: nginx:1.27
    container_name: nginx-proxy
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
